# Every push to main and every pull request: the tests on a real PostgreSQL, a lint for real
# errors, a check for dependencies with known vulnerabilities, and the Docker image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrictec_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d agrictec_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The tests wipe this database: it only exists for this run.
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/agrictec_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Pyflakes only (undefined names, unused imports, ...): the style rules aren't enforced.
      - run: ruff check . --select F
      - run: python -m pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t agrictec-api .
